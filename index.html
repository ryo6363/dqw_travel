<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DQW おみやげルーレット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg-start: #0a1130;
    --color-bg-end: #000509;
    --color-window-start: #2a3d9c;
    --color-window-end: #0c1442;
    --color-window-inner-border: #0a1030;
    --color-border: #f5f6fa;
    --color-gold: #ffd23f;
    --color-text: #f5f6fa;
    --color-text-dim: #aab4e0;
    --color-warn: #ff8a6b;
    --color-map-sea: #050821;
    --color-map-land: #3c4fb0;
    --color-success: #3ddc84;
    --color-danger: #ff5a6a;
    --color-abyss: #b98bff;
    --color-abyss-glow: #6a2fd9;
    --color-abyss-bg: #170b30;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(160deg, var(--color-bg-start), var(--color-bg-end));
    font-family: "DotGothic16", "Hiragino Sans", "Yu Gothic", "Meiryo", monospace;
    color: var(--color-text);
  }

  .page {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .rpg-window {
    background: linear-gradient(180deg, var(--color-window-start), var(--color-window-end));
    border: 4px solid var(--color-border);
    border-radius: 3px;
    box-shadow:
      inset 0 0 0 3px var(--color-window-inner-border),
      0 10px 30px rgba(0, 0, 0, 0.6);
    padding: 24px;
  }

  .title-window {
    text-align: center;
    padding: 40px 24px;
  }

  .title {
    margin: 0 0 18px;
    font-size: 1.7rem;
    color: var(--color-gold);
    letter-spacing: 0.06em;
    text-shadow: 2px 2px 0 #000;
  }

  .subtitle {
    margin: 0;
    font-size: 0.85rem;
    color: var(--color-text);
    line-height: 1.9;
    letter-spacing: 0.04em;
  }

  .filter-heading {
    margin: 0 0 16px;
    font-size: 1rem;
    color: var(--color-gold);
    letter-spacing: 0.04em;
  }

  .filter-group {
    margin-bottom: 16px;
  }

  .filter-group:last-of-type {
    margin-bottom: 0;
  }

  .filter-label {
    margin: 0 0 8px;
    font-size: 0.75rem;
    color: var(--color-text-dim);
    letter-spacing: 0.03em;
  }

  .filter-options {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
  }

  .region-option {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    cursor: pointer;
  }

  .distance-options {
    gap: 8px;
    margin-top: 10px;
  }

  .distance-mode-options {
    gap: 8px;
  }

  .distance-mode-options .filter-chip {
    min-width: 64px;
    text-align: center;
  }

  .filter-chip {
    font-family: inherit;
    font-size: 0.75rem;
    color: var(--color-text);
    background: var(--color-window-end);
    border: 2px solid var(--color-border);
    border-radius: 3px;
    padding: 6px 12px;
    cursor: pointer;
  }

  .filter-chip.is-active {
    background: var(--color-gold);
    color: var(--color-window-end);
    border-color: var(--color-gold);
    font-weight: bold;
  }

  .filter-count {
    margin: 16px 0 0;
    padding-top: 12px;
    border-top: 2px dashed rgba(245, 246, 250, 0.3);
    font-size: 0.8rem;
    color: var(--color-text-dim);
    text-align: right;
  }

  .roulette-window {
    text-align: center;
  }

  .mode-select {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 18px;
  }

  .mode-button {
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--color-text);
    background: var(--color-window-end);
    border: 3px solid var(--color-border);
    border-radius: 3px;
    padding: 10px 16px;
    cursor: pointer;
    letter-spacing: 0.03em;
  }

  .mode-button.is-active {
    background: var(--color-gold);
    color: var(--color-window-end);
    border-color: var(--color-gold);
    font-weight: bold;
  }

  .mode-button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .roulette-controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-bottom: 18px;
  }

  .roulette-button,
  .stop-button {
    font-family: inherit;
    font-size: 1rem;
    letter-spacing: 0.06em;
    color: var(--color-gold);
    background: var(--color-window-end);
    border: 3px solid var(--color-border);
    border-radius: 3px;
    padding: 14px 28px;
    cursor: pointer;
  }

  .roulette-button::before {
    content: "▶ ";
    animation: cursor-blink 1s steps(1) infinite;
  }

  .stop-button {
    color: var(--color-danger);
    border-color: var(--color-danger);
  }

  .stop-button::before {
    content: "■ ";
  }

  .stop-button:not(:disabled) {
    animation: stop-ready-pulse 1s steps(1) infinite;
  }

  .roulette-button:disabled,
  .stop-button:disabled {
    color: var(--color-text-dim);
    border-color: var(--color-border);
    cursor: default;
    opacity: 0.6;
  }

  .roulette-button:disabled::before {
    animation: none;
  }

  @keyframes cursor-blink {
    50% {
      opacity: 0;
    }
  }

  @keyframes stop-ready-pulse {
    50% {
      opacity: 0.6;
    }
  }

  .stage {
    margin-bottom: 8px;
  }

  .stage[hidden] {
    display: none;
  }

  .scroll-frame {
    position: relative;
    overflow: hidden;
    border: 3px solid var(--color-border);
    border-radius: 4px;
    background:
      repeating-linear-gradient(
        180deg,
        rgba(255, 210, 63, 0.05) 0px,
        rgba(255, 210, 63, 0.05) 2px,
        transparent 2px,
        transparent 6px
      ),
      linear-gradient(180deg, var(--color-window-start), var(--color-window-end));
    box-shadow: inset 0 0 0 2px var(--color-window-inner-border);
    padding: 28px 16px;
  }

  .result-slot {
    position: relative;
    z-index: 1;
    margin: 0;
    font-size: 1.3rem;
    font-weight: bold;
    letter-spacing: 0.05em;
    color: var(--color-text);
    text-shadow: 0 0 0 transparent;
    transition: text-shadow 0.15s ease;
  }

  .result-slot.is-spinning {
    color: var(--color-gold);
    text-shadow: 0 0 10px rgba(255, 210, 63, 0.7);
  }

  .scroll-flash {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.95), rgba(255, 210, 63, 0.4) 55%, transparent 75%);
    opacity: 0;
    pointer-events: none;
  }

  .scroll-flash.is-flashing {
    animation: scroll-flash-pop 0.6s ease-out;
  }

  @keyframes scroll-flash-pop {
    0% {
      opacity: 0;
    }
    15% {
      opacity: 1;
    }
    100% {
      opacity: 0;
    }
  }

  .scroll-impact {
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 2;
    margin: 0;
    font-size: 2rem;
    font-weight: bold;
    color: var(--color-gold);
    text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.4) rotate(-8deg);
    pointer-events: none;
  }

  .scroll-impact.is-visible {
    animation: scroll-impact-pop 0.7s cubic-bezier(0.2, 1.4, 0.4, 1);
  }

  @keyframes scroll-impact-pop {
    0% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.3) rotate(-8deg);
    }
    30% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.15) rotate(-4deg);
    }
    55% {
      transform: translate(-50%, -50%) scale(0.95) rotate(0deg);
    }
    80% {
      opacity: 1;
    }
    100% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.95) rotate(0deg);
    }
  }

  .scroll-stage.is-shaking .scroll-frame {
    animation: scroll-shake 0.4s ease-in-out;
  }

  @keyframes scroll-shake {
    0%, 100% {
      transform: translate(0, 0);
    }
    20% {
      transform: translate(-4px, 2px);
    }
    40% {
      transform: translate(4px, -2px);
    }
    60% {
      transform: translate(-3px, -1px);
    }
    80% {
      transform: translate(3px, 1px);
    }
  }

  .compass-frame {
    position: relative;
    width: 100%;
    max-width: 300px;
    margin: 0 auto;
  }

  .compass-svg {
    display: block;
    width: 100%;
    height: auto;
  }

  .compass-outer-ring {
    fill: var(--color-window-end);
    stroke: var(--color-gold);
    stroke-width: 3;
  }

  .compass-star-ring {
    fill: none;
    stroke: rgba(255, 210, 63, 0.4);
    stroke-width: 1;
    stroke-dasharray: 2 6;
  }

  .compass-wedge {
    stroke: var(--color-gold);
    stroke-width: 1.5;
    stroke-linejoin: round;
  }

  .compass-wedge.is-even {
    fill: var(--color-window-start);
  }

  .compass-wedge.is-odd {
    fill: var(--color-window-end);
  }

  .compass-wedge.is-landed {
    fill: var(--color-gold);
    animation: compass-wedge-glow 0.9s ease-in-out infinite;
  }

  @keyframes compass-wedge-glow {
    0%, 100% {
      opacity: 1;
    }
    50% {
      opacity: 0.6;
    }
  }

  .compass-label {
    font-family: inherit;
    font-size: 9px;
    fill: var(--color-text);
    pointer-events: none;
  }

  .compass-label.is-landed {
    fill: var(--color-window-end);
    font-weight: bold;
  }

  .compass-hub-outer {
    fill: var(--color-window-end);
    stroke: var(--color-gold);
    stroke-width: 2;
  }

  .compass-hub-inner {
    fill: url(#compass-hub-gradient);
    stroke: var(--color-border);
    stroke-width: 1;
  }

  .compass-pointer {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.6rem;
    line-height: 1;
    color: var(--color-gold);
    text-shadow: 0 0 6px rgba(255, 210, 63, 0.8), 2px 2px 0 #000;
  }

  .result-box {
    margin-top: 20px;
    padding-top: 18px;
    border-top: 2px dashed rgba(245, 246, 250, 0.3);
    min-height: 108px;
  }

  .result-placeholder {
    margin: 0;
    font-size: 0.85rem;
    color: var(--color-text-dim);
  }

  .result-message {
    margin: 0 0 14px;
    font-size: 0.9rem;
    color: var(--color-gold);
  }

  .result-message.is-warning {
    color: var(--color-warn);
  }

  .result-line {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 0.85rem;
    padding: 6px 2px;
    border-bottom: 1px dotted rgba(245, 246, 250, 0.25);
    text-align: left;
  }

  .result-line .label {
    color: var(--color-text-dim);
    white-space: nowrap;
  }

  .result-line .value {
    color: var(--color-text);
    font-weight: bold;
    text-align: right;
  }

  .result-distance {
    margin-top: 14px;
    padding: 10px;
    border-top: 1px dotted rgba(245, 246, 250, 0.25);
    font-size: 0.85rem;
    text-align: center;
    border-radius: 3px;
  }

  .result-distance-value {
    font-weight: bold;
    letter-spacing: 0.03em;
  }

  .result-distance.tier-safe .result-distance-value {
    color: var(--color-success);
  }

  .result-distance.tier-day .result-distance-value {
    color: var(--color-gold);
  }

  .result-distance.tier-expedition .result-distance-value {
    color: var(--color-danger);
  }

  .result-distance.tier-abyss {
    margin-top: 18px;
    padding: 12px 10px;
    background: radial-gradient(ellipse at center, var(--color-abyss-bg), transparent 75%);
    border-top: 1px dotted rgba(185, 139, 255, 0.35);
  }

  .result-distance.tier-abyss .result-distance-value {
    color: var(--color-abyss);
    text-shadow: 0 0 8px var(--color-abyss-glow), 0 0 18px rgba(106, 47, 217, 0.6);
    animation: abyss-flicker 2.4s ease-in-out infinite;
  }

  .result-distance-epithet {
    display: block;
    margin-top: 6px;
    font-size: 0.8rem;
    color: var(--color-abyss);
    text-shadow: 0 0 6px var(--color-abyss-glow);
    letter-spacing: 0.06em;
    animation: abyss-flicker 2.4s ease-in-out infinite;
    animation-delay: 0.3s;
  }

  @keyframes abyss-flicker {
    0%, 100% {
      opacity: 1;
    }
    45% {
      opacity: 0.5;
    }
    50% {
      opacity: 0.85;
    }
    55% {
      opacity: 0.45;
    }
    70% {
      opacity: 1;
    }
  }

  .result-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 16px;
  }

  .result-action-button {
    font-family: inherit;
    font-size: 0.8rem;
    color: var(--color-gold);
    background: var(--color-window-end);
    border: 2px solid var(--color-border);
    border-radius: 3px;
    padding: 9px 16px;
    cursor: pointer;
    letter-spacing: 0.02em;
  }

  .map-heading {
    margin: 0 0 16px;
    font-size: 1rem;
    color: var(--color-gold);
    letter-spacing: 0.04em;
  }

  .map-frame {
    width: 100%;
    aspect-ratio: 1 / 1;
    border: 2px solid var(--color-border);
    border-radius: 3px;
    overflow: hidden;
    background: var(--color-map-sea);
  }

  .japan-map {
    display: block;
    width: 100%;
    height: 100%;
  }

  .map-sea {
    fill: var(--color-map-sea);
  }

  .map-land {
    fill: var(--color-map-land);
    stroke: var(--color-gold);
    stroke-width: 2;
    stroke-linejoin: round;
  }

  .map-caption {
    margin: 12px 0 0;
    font-size: 0.8rem;
    color: var(--color-text-dim);
    text-align: center;
    min-height: 1.4em;
  }

  .map-marker {
    opacity: 0;
    transition: opacity 0.25s ease;
  }

  .map-marker.is-active {
    opacity: 1;
  }

  .map-marker circle {
    transform-box: fill-box;
    transform-origin: center;
  }

  .marker-glow-outer {
    fill: var(--color-gold);
    opacity: 0.3;
    animation: marker-pulse-outer 1.6s ease-in-out infinite;
  }

  .marker-glow-inner {
    fill: var(--color-gold);
    opacity: 0.55;
    animation: marker-pulse-inner 1.6s ease-in-out infinite;
  }

  .marker-core {
    fill: #ffffff;
    filter: drop-shadow(0 0 3px var(--color-gold));
    animation: marker-twinkle 1.6s ease-in-out infinite;
  }

  @keyframes marker-pulse-outer {
    0%, 100% {
      transform: scale(0.6);
      opacity: 0.12;
    }
    50% {
      transform: scale(1.5);
      opacity: 0.4;
    }
  }

  @keyframes marker-pulse-inner {
    0%, 100% {
      transform: scale(0.75);
      opacity: 0.45;
    }
    50% {
      transform: scale(1.15);
      opacity: 0.9;
    }
  }

  @keyframes marker-twinkle {
    0%, 100% {
      opacity: 0.7;
    }
    50% {
      opacity: 1;
    }
  }

  .list-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }

  .list-tabs[hidden] {
    display: none;
  }

  .list-tab {
    font-family: inherit;
    font-size: 0.7rem;
    color: var(--color-text);
    background: var(--color-window-end);
    border: 2px solid var(--color-border);
    border-radius: 3px;
    padding: 5px 10px;
    cursor: pointer;
    white-space: nowrap;
  }

  .list-tab.is-active {
    background: var(--color-gold);
    color: var(--color-window-end);
    border-color: var(--color-gold);
    font-weight: bold;
  }

  .bulk-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 4px 0 16px;
  }

  .bulk-button {
    font-family: inherit;
    font-size: 0.7rem;
    background: var(--color-window-end);
    border: 2px solid;
    border-radius: 3px;
    padding: 8px 12px;
    cursor: pointer;
    letter-spacing: 0.03em;
  }

  .bulk-button-check {
    color: var(--color-success);
    border-color: var(--color-success);
  }

  .bulk-button-uncheck {
    color: var(--color-danger);
    border-color: var(--color-danger);
  }

  .bulk-button:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(2, 4, 16, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 100;
  }

  .modal-overlay[hidden] {
    display: none;
  }

  .modal-window {
    width: 100%;
    max-width: 360px;
    text-align: center;
  }

  .modal-message {
    margin: 0 0 22px;
    font-size: 0.9rem;
    line-height: 1.9;
    letter-spacing: 0.03em;
  }

  .modal-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  .modal-button {
    font-family: inherit;
    font-size: 0.85rem;
    background: var(--color-window-end);
    border: 3px solid var(--color-border);
    border-radius: 3px;
    padding: 10px 24px;
    cursor: pointer;
    color: var(--color-text);
  }

  .modal-button-confirm {
    color: var(--color-gold);
  }

  .modal-button-confirm.is-danger {
    color: var(--color-danger);
    border-color: var(--color-danger);
  }

  .modal-button-confirm.is-success {
    color: var(--color-success);
    border-color: var(--color-success);
  }

  .spot-list-window {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .spot-list-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px 12px;
    margin-bottom: 16px;
  }

  .spot-list-heading {
    margin: 0;
    font-size: 1rem;
    color: var(--color-gold);
    letter-spacing: 0.04em;
  }

  .spot-count {
    margin: 0;
    font-size: 0.75rem;
    color: var(--color-text-dim);
  }

  .spot-list {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 380px;
    overflow-y: auto;
  }

  .spot-list::-webkit-scrollbar {
    width: 8px;
  }

  .spot-list::-webkit-scrollbar-track {
    background: rgba(245, 246, 250, 0.1);
  }

  .spot-list::-webkit-scrollbar-thumb {
    background: var(--color-gold);
    border-radius: 4px;
  }

  .spot-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 4px;
    border-bottom: 1px dotted rgba(245, 246, 250, 0.25);
    text-align: left;
    transition: opacity 0.15s ease;
  }

  .spot-item.is-collected {
    opacity: 0.5;
  }

  .spot-item.is-collected .spot-landmark {
    text-decoration: line-through;
  }

  .spot-checkbox-wrap {
    position: relative;
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    display: inline-flex;
    cursor: pointer;
  }

  .spot-checkbox-input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }

  .spot-checkbox-box {
    position: absolute;
    inset: 0;
    border: 2px solid var(--color-border);
    background: var(--color-window-end);
    pointer-events: none;
  }

  .spot-checkbox-box::after {
    content: "";
    position: absolute;
    left: 4px;
    top: 1px;
    width: 4px;
    height: 8px;
    border: solid var(--color-window-end);
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
    opacity: 0;
  }

  .spot-checkbox-input:checked ~ .spot-checkbox-box {
    background: var(--color-gold);
    border-color: var(--color-gold);
  }

  .spot-checkbox-input:checked ~ .spot-checkbox-box::after {
    opacity: 1;
  }

  .spot-checkbox-input:focus-visible ~ .spot-checkbox-box {
    outline: 2px solid var(--color-gold);
    outline-offset: 2px;
  }

  .spot-region {
    flex: 0 0 auto;
    font-size: 0.65rem;
    color: var(--color-window-end);
    background: var(--color-gold);
    border-radius: 3px;
    padding: 2px 8px;
  }

  .spot-pref {
    flex: 0 0 auto;
    font-size: 0.75rem;
    color: var(--color-text-dim);
    white-space: nowrap;
  }

  .spot-landmark {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 0.85rem;
  }

  .spot-map-button {
    flex: 0 0 auto;
    font-family: inherit;
    font-size: 0.65rem;
    line-height: 1;
    white-space: nowrap;
    color: var(--color-gold);
    background: var(--color-window-end);
    border: 2px solid var(--color-border);
    border-radius: 3px;
    padding: 4px 8px;
    cursor: pointer;
  }

  .spot-collected-label {
    display: none;
    flex: 0 0 auto;
    font-size: 0.6rem;
    color: var(--color-window-end);
    background: var(--color-gold);
    border-radius: 3px;
    padding: 2px 6px;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .spot-item.is-collected .spot-collected-label {
    display: inline-block;
  }
</style>
</head>
<body>
  <div class="page">
    <header class="rpg-window title-window">
      <h1 class="title">DQW おみやげルーレット</h1>
      <p class="subtitle">全国のおみやげスポットから<br>つぎの　もくてきちを　きめよう</p>
    </header>

    <section class="rpg-window filter-window" aria-label="しぼりこみ">
      <h2 class="filter-heading">しぼりこみ</h2>

      <div class="filter-group">
        <p class="filter-label">ちほう(未選択時は　ぜんちほう)</p>
        <div id="region-filter" class="filter-options region-options"></div>
      </div>

      <div class="filter-group">
        <p class="filter-label">きょり(奈良市から)</p>
        <div id="distance-mode-filter" class="filter-options distance-mode-options">
          <button type="button" class="filter-chip is-active" data-mode="within">以内</button>
          <button type="button" class="filter-chip" data-mode="atLeast">以上</button>
        </div>
        <div id="distance-filter" class="filter-options distance-options">
          <button type="button" class="filter-chip" data-distance="50">50km</button>
          <button type="button" class="filter-chip" data-distance="100">100km</button>
          <button type="button" class="filter-chip" data-distance="200">200km</button>
          <button type="button" class="filter-chip" data-distance="300">300km</button>
          <button type="button" class="filter-chip" data-distance="500">500km</button>
          <button type="button" class="filter-chip" data-distance="800">800km</button>
          <button type="button" class="filter-chip" data-distance="1000">1000km</button>
          <button type="button" class="filter-chip is-active" data-distance="all">制限なし</button>
        </div>
      </div>

      <p id="filter-count" class="filter-count">対象: 0件</p>
    </section>

    <section class="rpg-window roulette-window" aria-label="おみやげルーレット">
      <div class="mode-select" role="group" aria-label="えんしゅつをえらぶ">
        <button id="mode-scroll-button" type="button" class="mode-button" data-mode="scroll">めぐりの巻物</button>
        <button id="mode-compass-button" type="button" class="mode-button" data-mode="compass">運命の羅針盤</button>
      </div>

      <div class="roulette-controls">
        <button id="roulette-button" class="roulette-button" type="button">ルーレットを回す！</button>
        <button id="stop-button" class="stop-button" type="button" disabled hidden>ストップ！</button>
      </div>

      <div id="scroll-stage" class="stage scroll-stage">
        <div class="scroll-frame">
          <div id="scroll-flash" class="scroll-flash"></div>
          <p id="result-slot" class="result-slot">ボタンを　おすと……</p>
          <div id="scroll-impact" class="scroll-impact">ドン！</div>
        </div>
      </div>

      <div id="compass-stage" class="stage compass-stage" hidden>
        <div class="compass-frame">
          <svg id="compass-svg" class="compass-svg" viewBox="0 0 300 300" role="img" aria-label="運命の羅針盤">
            <defs>
              <radialGradient id="compass-hub-gradient" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#fff6d8" />
                <stop offset="100%" stop-color="var(--color-gold)" />
              </radialGradient>
            </defs>
            <circle class="compass-outer-ring" cx="150" cy="150" r="145" />
            <circle class="compass-star-ring" cx="150" cy="150" r="128" />
            <g id="compass-wheel-group"></g>
            <circle class="compass-hub-outer" cx="150" cy="150" r="26" />
            <circle class="compass-hub-inner" cx="150" cy="150" r="14" />
          </svg>
          <div class="compass-pointer" aria-hidden="true">▼</div>
        </div>
      </div>

      <div id="result-box" class="result-box">
        <p id="result-placeholder" class="result-placeholder">ボタンを　おすと……</p>
        <div id="result-detail" class="result-detail" hidden>
          <p id="result-message" class="result-message"></p>
          <div id="result-lines" class="result-lines">
            <div class="result-line">
              <span class="label">とどうふけん</span>
              <span id="result-pref" class="value"></span>
            </div>
            <div class="result-line">
              <span class="label">ランドマーク</span>
              <span id="result-landmark" class="value"></span>
            </div>
            <div class="result-line">
              <span class="label">おみやげ</span>
              <span id="result-souvenir" class="value"></span>
            </div>
          </div>
          <div id="result-distance" class="result-distance" hidden>
            <span id="result-distance-value" class="result-distance-value"></span>
            <span id="result-distance-epithet" class="result-distance-epithet" hidden></span>
          </div>
          <div id="result-actions" class="result-actions" hidden>
            <button id="map-link-button" type="button" class="result-action-button">地図で見る</button>
            <button id="drive-link-button" type="button" class="result-action-button">車で行く</button>
          </div>
        </div>
      </div>
    </section>

    <section class="rpg-window map-window" aria-label="ちず">
      <h2 class="map-heading">ちず</h2>
      <div class="map-frame">
        <svg class="japan-map" viewBox="128 -15 370 370" role="img" aria-label="日本列島をデフォルメした地図">
          <rect class="map-sea" x="-40" y="-60" width="600" height="600" />
          <polygon class="map-land" points="393,13 430,15 465,40 476,57 455,70 420,88 390,83 375,85 365,78 360,55 370,30 380,15" />
          <polygon class="map-land" points="389,100 391,130 378,160 375,190 390,205 370,215 358,218 345,232 339,247 322,238 298,237 290,245 284,260 275,274 262,263 270,247 255,238 238,247 220,250 209,253 195,258 179,263 185,245 200,232 225,228 245,229 263,222 275,218 300,205 320,195 341,177 350,160 362,137 370,120" />
          <polygon class="map-land" points="250,260 241,253 212,262 201,280 212,290 220,292 231,282 245,272" />
          <polygon class="map-land" points="196,277 168,271 159,274 149,292 164,295 173,327 190,308 205,282" />
          <g id="map-marker" class="map-marker" transform="translate(240,240)">
            <circle class="marker-glow-outer" r="16" />
            <circle class="marker-glow-inner" r="9" />
            <circle class="marker-core" r="4" />
          </g>
        </svg>
      </div>
      <p id="map-caption" class="map-caption">まだ　もくてきちは　きまっていない……</p>
    </section>

    <section class="rpg-window spot-list-window" aria-label="おみやげスポット一覧">
      <div class="spot-list-header">
        <h2 class="spot-list-heading">おみやげスポット　いちらん</h2>
        <p id="spot-count" class="spot-count"></p>
      </div>

      <div id="list-region-tabs" class="list-tabs" role="tablist" aria-label="ちほうタブ"></div>
      <div id="list-pref-tabs" class="list-tabs" role="tablist" aria-label="とどうふけんタブ" hidden></div>

      <div class="bulk-actions">
        <button id="bulk-check-button" type="button" class="bulk-button bulk-button-check">表示中を一括で取得済みにする</button>
        <button id="bulk-uncheck-button" type="button" class="bulk-button bulk-button-uncheck">表示中を一括で未取得に戻す</button>
      </div>

      <ul id="spot-list" class="spot-list"></ul>
    </section>
  </div>

  <div id="confirm-overlay" class="modal-overlay" hidden>
    <div class="rpg-window modal-window">
      <p id="confirm-message" class="modal-message"></p>
      <div class="modal-actions">
        <button id="confirm-yes-button" type="button" class="modal-button modal-button-confirm">はい</button>
        <button id="confirm-no-button" type="button" class="modal-button">いいえ</button>
      </div>
    </div>
  </div>

  <script src="map.js"></script>
  <script src="script.js"></script>
</body>
</html>

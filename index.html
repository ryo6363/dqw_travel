<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DQW おみやげルーレット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg-start: #0a1130;
    --color-bg-end: #000509;
    --color-window-start: #2a3d9c;
    --color-window-end: #0c1442;
    --color-window-inner-border: #0a1030;
    --color-border: #f5f6fa;
    --color-gold: #ffd23f;
    --color-text: #f5f6fa;
    --color-text-dim: #aab4e0;
    --color-warn: #ff8a6b;
    --color-map-sea: #050821;
    --color-map-land: #3c4fb0;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(160deg, var(--color-bg-start), var(--color-bg-end));
    font-family: "DotGothic16", "Hiragino Sans", "Yu Gothic", "Meiryo", monospace;
    color: var(--color-text);
  }

  .page {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .rpg-window {
    background: linear-gradient(180deg, var(--color-window-start), var(--color-window-end));
    border: 4px solid var(--color-border);
    border-radius: 3px;
    box-shadow:
      inset 0 0 0 3px var(--color-window-inner-border),
      0 10px 30px rgba(0, 0, 0, 0.6);
    padding: 24px;
  }

  .title-window {
    text-align: center;
    padding: 40px 24px;
  }

  .title {
    margin: 0 0 18px;
    font-size: 1.7rem;
    color: var(--color-gold);
    letter-spacing: 0.06em;
    text-shadow: 2px 2px 0 #000;
  }

  .subtitle {
    margin: 0;
    font-size: 0.85rem;
    color: var(--color-text);
    line-height: 1.9;
    letter-spacing: 0.04em;
  }

  .filter-heading {
    margin: 0 0 16px;
    font-size: 1rem;
    color: var(--color-gold);
    letter-spacing: 0.04em;
  }

  .filter-group {
    margin-bottom: 16px;
  }

  .filter-group:last-of-type {
    margin-bottom: 0;
  }

  .filter-label {
    margin: 0 0 8px;
    font-size: 0.75rem;
    color: var(--color-text-dim);
    letter-spacing: 0.03em;
  }

  .filter-options {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
  }

  .region-option {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    cursor: pointer;
  }

  .distance-options {
    gap: 8px;
  }

  .filter-chip {
    font-family: inherit;
    font-size: 0.75rem;
    color: var(--color-text);
    background: var(--color-window-end);
    border: 2px solid var(--color-border);
    border-radius: 3px;
    padding: 6px 12px;
    cursor: pointer;
  }

  .filter-chip.is-active {
    background: var(--color-gold);
    color: var(--color-window-end);
    border-color: var(--color-gold);
    font-weight: bold;
  }

  .filter-count {
    margin: 16px 0 0;
    padding-top: 12px;
    border-top: 2px dashed rgba(245, 246, 250, 0.3);
    font-size: 0.8rem;
    color: var(--color-text-dim);
    text-align: right;
  }

  .roulette-window {
    text-align: center;
  }

  .roulette-button {
    font-family: inherit;
    font-size: 1rem;
    letter-spacing: 0.06em;
    color: var(--color-gold);
    background: var(--color-window-end);
    border: 3px solid var(--color-border);
    border-radius: 3px;
    padding: 14px 28px;
    cursor: pointer;
  }

  .roulette-button::before {
    content: "▶ ";
    animation: cursor-blink 1s steps(1) infinite;
  }

  .roulette-button:disabled {
    color: var(--color-text-dim);
    cursor: default;
    opacity: 0.7;
  }

  .roulette-button:disabled::before {
    animation: none;
  }

  @keyframes cursor-blink {
    50% {
      opacity: 0;
    }
  }

  .result-box {
    margin-top: 20px;
    padding-top: 18px;
    border-top: 2px dashed rgba(245, 246, 250, 0.3);
    min-height: 108px;
  }

  .result-placeholder {
    margin: 0;
    font-size: 0.85rem;
    color: var(--color-text-dim);
  }

  .result-slot {
    margin: 0;
    font-size: 1.15rem;
    letter-spacing: 0.04em;
  }

  .result-message {
    margin: 0 0 14px;
    font-size: 0.9rem;
    color: var(--color-gold);
  }

  .result-message.is-warning {
    color: var(--color-warn);
  }

  .result-line {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 0.85rem;
    padding: 6px 2px;
    border-bottom: 1px dotted rgba(245, 246, 250, 0.25);
    text-align: left;
  }

  .result-line .label {
    color: var(--color-text-dim);
    white-space: nowrap;
  }

  .result-line .value {
    color: var(--color-text);
    font-weight: bold;
    text-align: right;
  }

  .map-heading {
    margin: 0 0 16px;
    font-size: 1rem;
    color: var(--color-gold);
    letter-spacing: 0.04em;
  }

  .map-frame {
    width: 100%;
    aspect-ratio: 1 / 1;
    border: 2px solid var(--color-border);
    border-radius: 3px;
    overflow: hidden;
    background: var(--color-map-sea);
  }

  .japan-map {
    display: block;
    width: 100%;
    height: 100%;
  }

  .map-sea {
    fill: var(--color-map-sea);
  }

  .map-land {
    fill: var(--color-map-land);
    stroke: var(--color-gold);
    stroke-width: 2;
    stroke-linejoin: round;
  }

  .map-caption {
    margin: 12px 0 0;
    font-size: 0.8rem;
    color: var(--color-text-dim);
    text-align: center;
    min-height: 1.4em;
  }

  .map-marker {
    opacity: 0;
    transition: opacity 0.25s ease;
  }

  .map-marker.is-active {
    opacity: 1;
  }

  .map-marker circle {
    transform-box: fill-box;
    transform-origin: center;
  }

  .marker-glow-outer {
    fill: var(--color-gold);
    opacity: 0.3;
    animation: marker-pulse-outer 1.6s ease-in-out infinite;
  }

  .marker-glow-inner {
    fill: var(--color-gold);
    opacity: 0.55;
    animation: marker-pulse-inner 1.6s ease-in-out infinite;
  }

  .marker-core {
    fill: #ffffff;
    filter: drop-shadow(0 0 3px var(--color-gold));
    animation: marker-twinkle 1.6s ease-in-out infinite;
  }

  @keyframes marker-pulse-outer {
    0%, 100% {
      transform: scale(0.6);
      opacity: 0.12;
    }
    50% {
      transform: scale(1.5);
      opacity: 0.4;
    }
  }

  @keyframes marker-pulse-inner {
    0%, 100% {
      transform: scale(0.75);
      opacity: 0.45;
    }
    50% {
      transform: scale(1.15);
      opacity: 0.9;
    }
  }

  @keyframes marker-twinkle {
    0%, 100% {
      opacity: 0.7;
    }
    50% {
      opacity: 1;
    }
  }

  .spot-list-window {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .spot-list-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px 12px;
    margin-bottom: 16px;
  }

  .spot-list-heading {
    margin: 0;
    font-size: 1rem;
    color: var(--color-gold);
    letter-spacing: 0.04em;
  }

  .spot-count {
    margin: 0;
    font-size: 0.75rem;
    color: var(--color-text-dim);
  }

  .spot-list {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 380px;
    overflow-y: auto;
  }

  .spot-list::-webkit-scrollbar {
    width: 8px;
  }

  .spot-list::-webkit-scrollbar-track {
    background: rgba(245, 246, 250, 0.1);
  }

  .spot-list::-webkit-scrollbar-thumb {
    background: var(--color-gold);
    border-radius: 4px;
  }

  .spot-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 4px;
    border-bottom: 1px dotted rgba(245, 246, 250, 0.25);
    text-align: left;
    transition: opacity 0.15s ease;
  }

  .spot-item.is-collected {
    opacity: 0.5;
  }

  .spot-item.is-collected .spot-landmark {
    text-decoration: line-through;
  }

  .spot-checkbox-wrap {
    position: relative;
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    display: inline-flex;
    cursor: pointer;
  }

  .spot-checkbox-input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }

  .spot-checkbox-box {
    position: absolute;
    inset: 0;
    border: 2px solid var(--color-border);
    background: var(--color-window-end);
    pointer-events: none;
  }

  .spot-checkbox-box::after {
    content: "";
    position: absolute;
    left: 4px;
    top: 1px;
    width: 4px;
    height: 8px;
    border: solid var(--color-window-end);
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
    opacity: 0;
  }

  .spot-checkbox-input:checked ~ .spot-checkbox-box {
    background: var(--color-gold);
    border-color: var(--color-gold);
  }

  .spot-checkbox-input:checked ~ .spot-checkbox-box::after {
    opacity: 1;
  }

  .spot-checkbox-input:focus-visible ~ .spot-checkbox-box {
    outline: 2px solid var(--color-gold);
    outline-offset: 2px;
  }

  .spot-region {
    flex: 0 0 auto;
    font-size: 0.65rem;
    color: var(--color-window-end);
    background: var(--color-gold);
    border-radius: 3px;
    padding: 2px 8px;
  }

  .spot-pref {
    flex: 0 0 auto;
    font-size: 0.75rem;
    color: var(--color-text-dim);
    white-space: nowrap;
  }

  .spot-landmark {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 0.85rem;
  }

  .spot-collected-label {
    display: none;
    flex: 0 0 auto;
    font-size: 0.6rem;
    color: var(--color-window-end);
    background: var(--color-gold);
    border-radius: 3px;
    padding: 2px 6px;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .spot-item.is-collected .spot-collected-label {
    display: inline-block;
  }
</style>
</head>
<body>
  <div class="page">
    <header class="rpg-window title-window">
      <h1 class="title">DQW おみやげルーレット</h1>
      <p class="subtitle">全国のおみやげスポットから<br>つぎの　もくてきちを　きめよう</p>
    </header>

    <section class="rpg-window filter-window" aria-label="しぼりこみ">
      <h2 class="filter-heading">しぼりこみ</h2>

      <div class="filter-group">
        <p class="filter-label">ちほう(未選択時は　ぜんちほう)</p>
        <div id="region-filter" class="filter-options region-options"></div>
      </div>

      <div class="filter-group">
        <p class="filter-label">きょり(奈良市から)</p>
        <div id="distance-filter" class="filter-options distance-options">
          <button type="button" class="filter-chip" data-distance="50">50km以内</button>
          <button type="button" class="filter-chip" data-distance="100">100km以内</button>
          <button type="button" class="filter-chip" data-distance="300">300km以内</button>
          <button type="button" class="filter-chip is-active" data-distance="all">制限なし</button>
        </div>
      </div>

      <p id="filter-count" class="filter-count">対象: 0件</p>
    </section>

    <section class="rpg-window roulette-window" aria-label="おみやげルーレット">
      <button id="roulette-button" class="roulette-button" type="button">ルーレットを回す！</button>

      <div id="result-box" class="result-box">
        <p id="result-placeholder" class="result-placeholder">ボタンを　おすと……</p>
        <p id="result-slot" class="result-slot" hidden></p>
        <div id="result-detail" class="result-detail" hidden>
          <p id="result-message" class="result-message"></p>
          <div id="result-lines" class="result-lines">
            <div class="result-line">
              <span class="label">とどうふけん</span>
              <span id="result-pref" class="value"></span>
            </div>
            <div class="result-line">
              <span class="label">ランドマーク</span>
              <span id="result-landmark" class="value"></span>
            </div>
            <div class="result-line">
              <span class="label">おみやげ</span>
              <span id="result-souvenir" class="value"></span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="rpg-window map-window" aria-label="ちず">
      <h2 class="map-heading">ちず</h2>
      <div class="map-frame">
        <svg class="japan-map" viewBox="0 0 480 480" role="img" aria-label="日本列島をデフォルメした地図">
          <rect class="map-sea" x="0" y="0" width="480" height="480" />
          <polygon class="map-land" points="360,50 385,30 415,25 435,45 440,75 425,105 395,115 365,100 350,75" />
          <polygon class="map-land" points="398,88 365,132 350,167 315,195 270,207 225,230 180,243 180,267 225,260 270,295 315,235 350,223 365,168 398,112" />
          <polygon class="map-land" points="230,258 250,256 263,270 253,285 230,288 213,275" />
          <polygon class="map-land" points="195,235 210,255 205,280 215,300 195,325 175,330 160,305 165,275 155,255 170,240" />
          <g id="map-marker" class="map-marker" transform="translate(240,240)">
            <circle class="marker-glow-outer" r="16" />
            <circle class="marker-glow-inner" r="9" />
            <circle class="marker-core" r="4" />
          </g>
        </svg>
      </div>
      <p id="map-caption" class="map-caption">まだ　もくてきちは　きまっていない……</p>
    </section>

    <section class="rpg-window spot-list-window" aria-label="おみやげスポット一覧">
      <div class="spot-list-header">
        <h2 class="spot-list-heading">おみやげスポット　いちらん</h2>
        <p id="spot-count" class="spot-count"></p>
      </div>
      <ul id="spot-list" class="spot-list"></ul>
    </section>
  </div>

  <script src="map.js"></script>
  <script src="script.js"></script>
</body>
</html>
